[platformio]
default_envs = controller, 6-inputs-1, 8-outputs-1

[env]
platform = ststm32@~19.5.0
framework = stm32cube
board = marine_stm32f070c6tx
build_type = debug
upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak main
monitor_speed = 115200
board_build.ldscript = ldscripts/STM32F070C6Tx_FLASH.ld
board_build.stm32cube.custom_config_header = yes
build_flags =
  -DUSE_HAL_DRIVER
  -I config/stm32
  -I include

[env:controller]
build_flags =
  ${env.build_flags}
  -I include/controller
build_src_filter =
  -<*>
  +<controller/>
  +<controller/**>

[env:8-outputs-1]
build_flags =
  ${env.build_flags}
  -I include/client
  -DNODE_BOARD_OUTPUT_8CH
  -DNODE_ID=10U
build_src_filter =
  -<*>
  +<client/>
  +<client/**>

[env:8-outputs-2]
build_flags =
  ${env.build_flags}
  -I include/client
  -DNODE_BOARD_OUTPUT_8CH
  -DNODE_ID=11U
build_src_filter =
  -<*>
  +<client/>
  +<client/**>

[env:8-outputs-3]
build_flags =
  ${env.build_flags}
  -I include/client
  -DNODE_BOARD_OUTPUT_8CH
  -DNODE_ID=12U
build_src_filter =
  -<*>
  +<client/>
  +<client/**>

[env:6-inputs-1]
build_flags =
  ${env.build_flags}
  -I include/client
  -DNODE_BOARD_INPUT_PANEL
  -DNODE_ID=1U
build_src_filter =
  -<*>
  +<client/>
  +<client/**>

[env:6-inputs-2]
build_flags =
  ${env.build_flags}
  -I include/client
  -DNODE_BOARD_INPUT_PANEL
  -DNODE_ID=2U
build_src_filter =
  -<*>
  +<client/>
  +<client/**>

[env:6-inputs-3]
build_flags =
  ${env.build_flags}
  -I include/client
  -DNODE_BOARD_INPUT_PANEL
  -DNODE_ID=3U
build_src_filter =
  -<*>
  +<client/>
  +<client/**>
